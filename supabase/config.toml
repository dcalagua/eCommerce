# Configuracion local de Supabase para eCommerce by EBIM.
# Proyecto DEV/QAS de eCommerce. Confirmado y enlazado (P09).
project_id = "ehxlxbhtlmfgneiagdcj"

[api]
enabled = true
port = 54321
# `ebim` NO se expone por PostgREST: sus funciones son de policy, no de API.
# Las operaciones de servidor viven en `public` con EXECUTE revocado a anon.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

# Datos de DEMO del storefront (P05). Solo los aplica `supabase db reset` en
# local: en remoto no corre nada de esto.
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true

# --- Edge Functions ---------------------------------------------------------
# `verify_jwt = false` en las dos publicas/servidor porque su autorizacion no es
# SIEMPRE un JWT de usuario: `create-order` lo llama un comprador anonimo y
# `bootstrap-tenant` admite ademas la clave de aprovisionamiento en cabecera
# (alta desde el operador, cuando todavia no hay usuario).
# En el camino de alta de si mismo (P03) `bootstrap-tenant` verifica la firma
# del token a mano (`_runtime/verify.ts`) antes de usar `service_role`: el flag
# de la plataforma no puede quedarse como unica defensa de ese camino.
[functions.bootstrap-tenant]
verify_jwt = false

[functions.create-order]
verify_jwt = false

[functions.catalog-product]
verify_jwt = true

[functions.update-order-status]
verify_jwt = true
